server:
  port: 8082
  # 文件上传大小限制（视频帧可能较大）
  tomcat:
    max-swallow-size: 10MB

spring:
  devtools:
    restart:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/fruitpicking?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # Jackson 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  mail:
    host: smtp.qq.com
    port: 465
    username: 1500183776@qq.com
    password: twekpecexfhxhiii
    protocol: smtps
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            protocols: TLSv1.2
          starttls:
            enable: true
            required: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.FruitPickingRobt.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    root: info
    com.FruitPickingRobt: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


app:
  history-default-limit: 1000
  history-max-limit: 5000
  # 设备会话心跳超时（秒）。0 或负数 = 停用僵尸会话清理（测试用）；生产建议设 60
  device-session:
    stale-timeout-seconds: 0

security:
  jwt:
    header: Authorization
    token-start-with: "Bearer"
    base64-secret: "your-256-bit-secret-key-here-please-use-a-long-random-string"
    token-validity-seconds: 86400
    ignore-paths:
      - /api/v1/codes/**
      - /api/v1/users
      - /api/v1/users/login
      - /api/v1/password-reset
      - /error
      - /api/history
      - /api/latest
      - /api/video/**
      - /simulator.html
      - /test-helper.html
      - /api/devices/**
      - /ws/**
    admin-paths:
      - /api/v1/admin/**
