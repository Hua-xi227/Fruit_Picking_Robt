<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 测试助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        h1 { color: #4caf50; margin-bottom: 16px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full { grid-column: 1 / -1; }
        .card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #3a3a3a;
        }
        .card h2 { color: #ffd700; font-size: 16px; margin-bottom: 12px; }
        .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        input, select {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            flex: 1;
        }
        button {
            padding: 8px 16px;
            background: #4caf50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #43a047; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #d32f2f; }
        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            background: #555;
        }
        .status.online { background: #4caf50; }
        #log {
            background: #111;
            border-radius: 4px;
            padding: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        #log .success { color: #4caf50; }
        #log .error { color: #f44336; }
        #log .info { color: #90caf9; }
        #log .recv { color: #ffb74d; }
        #map {
            width: 100%;
            height: 400px;
            background: #111;
            border-radius: 4px;
            position: relative;
        }
        #mapCanvas { width: 100%; height: 100%; }
        #videoCanvas {
            width: 100%;
            max-width: 640px;
            background: #000;
            border-radius: 4px;
            min-height: 240px;
            display: block;
            image-rendering: auto;
        }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 13px; }
        .info-grid div { background: #1a1a1a; padding: 6px 10px; border-radius: 4px; }
        .info-grid span { color: #ffd700; }
    </style>
</head>
<body>
<h1>🔧 采摘机器人 WebSocket 测试助手</h1>

<div class="container">
    <!-- 连接配置 -->
    <div class="card full">
        <h2>1. 连接配置</h2>
        <div class="row">
            <label>后端地址:</label>
            <input type="text" id="serverUrl" placeholder="http://192.168.1.100:8082">
            <button id="btnConnect">连接</button>
            <button id="btnDisconnect" class="danger">断开</button>
            <span class="status" id="connStatus">未连接</span>
        </div>
        <div class="row">
            <button id="btnLoadHistory">加载历史轨迹</button>
            <button id="btnGetLatest">获取最新位置</button>
            <button id="btnClearLog">清空日志</button>
        </div>
    </div>

    <!-- 实时信息 -->
    <div class="card">
        <h2>2. 最新位置信息</h2>
        <div class="info-grid">
            <div>设备ID: <span id="infoDeviceId">--</span></div>
            <div>时间: <span id="infoTime">--</span></div>
            <div>经度: <span id="infoLng">--</span></div>
            <div>纬度: <span id="infoLat">--</span></div>
            <div>方向角: <span id="infoBearing">--</span>°</div>
            <div>轨迹点数: <span id="infoPointCount">0</span></div>
        </div>
    </div>

    <!-- 视频预览 -->
    <div class="card">
        <h2>3. 视频流预览</h2>
        <video id="videoPlayer" autoplay playsinline muted style="width:100%;max-width:640px;background:#000;border-radius:4px;min-height:240px;"></video>
        <canvas id="videoCanvas" width="640" height="480" style="display:none;"></canvas>
        <div class="row" style="margin-top: 8px;">
            <button id="btnStartVideo">开启视频</button>
            <button id="btnStopVideo" class="danger">关闭视频</button>
        </div>
    </div>

    <!-- 轨迹地图 -->
    <div class="card full">
        <h2>4. 轨迹地图（简易可视化）</h2>
        <div id="map">
            <canvas id="mapCanvas"></canvas>
        </div>
    </div>

    <!-- 通信日志 -->
    <div class="card full">
        <h2>5. 通信日志</h2>
        <div id="log"></div>
    </div>
</div>

<script>
    // 全局变量
    let ws = null;
    let isConnected = false;
    const points = []; // 轨迹点数组
    const MAX_POINTS = 200;
    let videoTimer = null;

    // 工具函数
    function log(msg, type = 'info') {
        const logEl = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = type;
        div.textContent = `[${time}] ${msg}`;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function getServerUrl() {
        let url = document.getElementById('serverUrl').value.trim();
        if (!url) {
            url = `${location.protocol}//${location.hostname}:8082`;
        }
        return url.replace(/\/$/, '');
    }

    // 与 simulator.html 保持同一个设备ID
    function getDeviceId() {
        return 'car-001';
    }

    function setConnStatus(online) {
        const el = document.getElementById('connStatus');
        el.textContent = online ? '已连接' : '未连接';
        el.className = 'status' + (online ? ' online' : '');
        isConnected = online;
    }

    // 1. WebSocket 连接
    document.getElementById('btnConnect').onclick = function() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            log('已经处于连接状态', 'error');
            return;
        }
        const baseUrl = getServerUrl().replace(/^http/, 'ws');
        // 作为查看者，必须连 /ws/frontend，订阅设备后才能收到广播
        const wsUrl = `${baseUrl}/ws/frontend`;
        log(`正在连接: ${wsUrl}`);
        try {
            ws = new WebSocket(wsUrl);
            ws.binaryType = 'arraybuffer';
            ws.onopen = () => {
                setConnStatus(true);
                log('WebSocket 连接成功 ✓', 'success');
                // 连接成功后立即订阅设备，否则收不到任何推送
                const deviceId = getDeviceId();
                ws.send(JSON.stringify({ type: 'subscribe', deviceId: deviceId }));
                log(`已订阅设备: ${deviceId}`, 'success');
            };
            ws.onclose = () => {
                setConnStatus(false);
                log('WebSocket 已断开', 'info');
            };
            ws.onerror = (e) => log('WebSocket 错误', 'error');
            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    handleBinaryVideo(event.data);
                    return;
                }
                try {
                    const data = JSON.parse(event.data);
                    const la = data.lat ?? data.latitude;
                    const lo = data.lng ?? data.longitude;
                    if (data.type === 'subscribed') {
                        log(`订阅成功: deviceId=${data.deviceId}`, 'success');
                    } else if (la != null && lo != null) {
                        addPoint({ lat: la, lng: lo, bearing: data.bearing });
                        updateInfo(data);
                        drawMap();
                    } else if (data.type === 'video_frame') {
                        if (data.image) {
                            const base64 = data.image.includes(',') ? data.image.split(',')[1] : data.image;
                            fetch(`data:image/jpeg;base64,${base64}`)
                                .then(r => r.blob())
                                .then(b => renderJpegBlob(b));
                        }
                    }
                } catch (e) {}
            };
        } catch (e) {
            log('连接失败: ' + e.message, 'error');
        }
    };

    document.getElementById('btnDisconnect').onclick = function() {
        if (ws) {
            ws.close();
            ws = null;
            log('已主动断开', 'info');
        }
    };

    // 2. 加载历史轨迹
    document.getElementById('btnLoadHistory').onclick = function() {
        const deviceId = getDeviceId();
        const url = `${getServerUrl()}/api/devices/${deviceId}/history?format=coordinates`;
        log(`GET ${url}`);
        fetch(url)
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(list => {
                if (!Array.isArray(list)) {
                    log('历史数据格式异常: ' + JSON.stringify(list).substring(0, 100), 'error');
                    return;
                }
                points.length = 0;
                // 后端 format=coordinates 返回 [[经度, 纬度], ...]
                list.forEach(pair => {
                    const lng = pair[0], lat = pair[1];
                    if (typeof lng === 'number' && typeof lat === 'number') {
                        points.push({ lat: lat, lng: lng });
                    }
                });
                log(`加载了 ${points.length} 个历史轨迹点`, 'success');
                drawMap();
                updateInfo({});
            })
            .catch(e => log('加载历史失败: ' + e.message, 'error'));
    };

    document.getElementById('btnGetLatest').onclick = function() {
        const deviceId = getDeviceId();
        const url = `${getServerUrl()}/api/devices/${deviceId}/latest`;
        log(`GET ${url}`);
        fetch(url)
            .then(r => {
                if (r.status === 204) {
                    log('当前无最新位置数据', 'info');
                    return null;
                }
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                if (data) {
                    log('最新位置: ' + JSON.stringify(data).substring(0, 120), 'success');
                    // 后端 latest 把位置放在 location 字段下，这里做兼容
                    const loc = data.location || data;
                    updateInfo({
                        deviceId: data.deviceId || deviceId,
                        lat: loc.latitude ?? loc.lat,
                        lng: loc.longitude ?? loc.lng,
                        bearing: loc.bearing,
                        timestamp: loc.recordedAt || loc.timestamp
                    });
                }
            })
            .catch(e => log('获取最新位置失败: ' + e.message, 'error'));
    };

    document.getElementById('btnClearLog').onclick = function() {
        document.getElementById('log').innerHTML = '';
    };

    // 3. 信息显示
    function addPoint(data) {
        points.push(data);
        if (points.length > MAX_POINTS) {
            points.shift();
        }
    }

    function updateInfo(data) {
        if (data.deviceId) document.getElementById('infoDeviceId').textContent = data.deviceId;
        const lo = data.lng ?? data.longitude;
        const la = data.lat ?? data.latitude;
        if (lo != null) document.getElementById('infoLng').textContent = Number(lo).toFixed(6);
        if (la != null) document.getElementById('infoLat').textContent = Number(la).toFixed(6);
        if (data.bearing != null) document.getElementById('infoBearing').textContent = Number(data.bearing).toFixed(1);
        const ts = data.timestamp || data.recordedAt;
        if (ts) {
            document.getElementById('infoTime').textContent = new Date(ts).toLocaleTimeString();
        } else {
            document.getElementById('infoTime').textContent = new Date().toLocaleTimeString();
        }
        document.getElementById('infoPointCount').textContent = points.length;
    }

    // 4. 简易地图绘制
    function drawMap() {
        const canvas = document.getElementById('mapCanvas');
        const container = document.getElementById('map');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (points.length === 0) {
            ctx.fillStyle = '#666';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('暂无轨迹数据', canvas.width / 2, canvas.height / 2);
            return;
        }

        // 计算坐标范围（自动适配）
        let minLng = points[0].lng, maxLng = points[0].lng;
        let minLat = points[0].lat, maxLat = points[0].lat;
        points.forEach(p => {
            minLng = Math.min(minLng, p.lng);
            maxLng = Math.max(maxLng, p.lng);
            minLat = Math.min(minLat, p.lat);
            maxLat = Math.max(maxLat, p.lat);
        });
        // 留点边距
        const lngRange = (maxLng - minLng) || 0.001;
        const latRange = (maxLat - minLat) || 0.001;
        const padding = 0.2;
        minLng -= lngRange * padding;
        maxLng += lngRange * padding;
        minLat -= latRange * padding;
        maxLat += latRange * padding;

        const padding2 = 20;
        const w = canvas.width - padding2 * 2;
        const h = canvas.height - padding2 * 2;

        // 画网格
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 10; i++) {
            ctx.beginPath();
            ctx.moveTo(padding2 + (w / 10) * i, padding2);
            ctx.lineTo(padding2 + (w / 10) * i, padding2 + h);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(padding2, padding2 + (h / 10) * i);
            ctx.lineTo(padding2 + w, padding2 + (h / 10) * i);
            ctx.stroke();
        }

        // 工具：经纬度转屏幕坐标
        function toScreen(lng, lat) {
            const x = padding2 + ((lng - minLng) / (maxLng - minLng)) * w;
            const y = padding2 + h - ((lat - minLat) / (maxLat - minLat)) * h;
            return { x, y };
        }

        // 画轨迹线
        ctx.strokeStyle = '#4caf50';
        ctx.lineWidth = 2;
        ctx.beginPath();
        points.forEach((p, i) => {
            const { x, y } = toScreen(p.lng, p.lat);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // 画点
        points.forEach((p, i) => {
            const { x, y } = toScreen(p.lng, p.lat);
            ctx.fillStyle = i === points.length - 1 ? '#ff5722' : '#8bc34a';
            ctx.beginPath();
            ctx.arc(x, y, i === points.length - 1 ? 6 : 3, 0, Math.PI * 2);
            ctx.fill();
        });

        // 显示最新点
        const last = points[points.length - 1];
        if (last.bearing != null) {
            const { x, y } = toScreen(last.lng, last.lat);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(last.bearing * Math.PI / 180);
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(-5, -5);
            ctx.lineTo(-5, 5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    // 5. 视频流控制
    let videoEnabled = true;
    const videoCanvas = document.getElementById('videoCanvas');
    const videoCtx = videoCanvas.getContext('2d');
    const videoPlayer = document.getElementById('videoPlayer');

    // MSE（MediaSource Extensions）播放 WebM 视频流——硬件解码，跟摄像头同帧率
    let mediaSource = null;
    let sourceBuffer = null;
    let mimeType = 'video/webm;codecs=vp9';
    let pendingChunks = [];

    function initMediaSource() {
        if (mediaSource) return;
        if (!window.MediaSource) {
            log('浏览器不支持 MSE，将用 canvas 渲染 JPEG 帧', 'warn');
            return;
        }
        // 探测支持的编码
        if (!MediaSource.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=vp8';
        if (!MediaSource.isTypeSupported(mimeType)) mimeType = 'video/webm';

        mediaSource = new MediaSource();
        videoPlayer.src = URL.createObjectURL(mediaSource);
        mediaSource.addEventListener('sourceopen', () => {
            try {
                sourceBuffer = mediaSource.addSourceBuffer(mimeType);
                // sequence 模式：MSE 忽略媒体内部时间戳，按追加顺序连续排列。
                // 直播流必须用 sequence，否则 MediaRecorder 每秒重启产生的多段会
                // 形成多个 buffered range，导致 behind 计算失真、延迟无限累积。
                sourceBuffer.mode = 'sequence';
                sourceBuffer.addEventListener('updateend', drainPendingChunks);
                sourceBuffer.addEventListener('error', (e) => {
                    log('MSE SourceBuffer 错误: ' + (sourceBuffer.error?.message || '未知'), 'error');
                });
                log('MSE 已就绪: ' + mimeType, 'success');
                // ★ 关键修复：sourceopen 是异步的，第一块（含 WebM init segment）
                //   可能在此之前已到达并存入 pendingChunks。必须立即排空，
                //   否则 init segment 丢失，后续媒体段无法解码 → 永久黑屏。
                drainPendingChunks();
            } catch (e) {
                log('MSE SourceBuffer 创建失败: ' + e.message, 'error');
            }
        });
        mediaSource.addEventListener('error', (e) => {
            log('MSE 错误: ' + (mediaSource.error?.message || '未知'), 'error');
        });
        videoPlayer.addEventListener('error', () => {
            log('video 元素播放错误: ' + (videoPlayer.error?.message || '未知'), 'error');
        });
        videoPlayer.addEventListener('loadeddata', () => {
            log('视频首帧已加载，开始播放', 'success');
            videoPlayer.play().catch(() => {});
        });
    }

    function drainPendingChunks() {
        if (!sourceBuffer || sourceBuffer.updating) return;
        while (pendingChunks.length > 0 && !sourceBuffer.updating) {
            const chunk = pendingChunks.shift();
            try { sourceBuffer.appendBuffer(chunk); } catch (e) {}
        }
    }

    // 低延迟控制：每 50ms 检测一次，紧贴直播边缘
    //   - 延迟 > 200ms：直接 seek 到直播边缘（保留 50ms 缓冲防卡顿）
    //   - 延迟 100~200ms：加速 2x 平滑追赶
    //   - 延迟 < 100ms：正常速度
    //   - 停滞检测：currentTime 150ms 不前进 → 丢帧冻结，seek 恢复
    let lastCurrentTime = 0;
    let lastAdvanceTime = Date.now();

    setInterval(() => {
        if (!videoEnabled || !videoPlayer || !sourceBuffer || videoPlayer.buffered.length === 0) return;
        if (videoPlayer.paused) videoPlayer.play().catch(() => {});

        const end = videoPlayer.buffered.end(videoPlayer.buffered.length - 1);
        const current = videoPlayer.currentTime;
        const behind = end - current;
        const now = Date.now();

        // 停滞检测：丢帧导致解码器卡住时，currentTime 不再前进
        if (Math.abs(current - lastCurrentTime) < 0.001) {
            if (now - lastAdvanceTime > 150 && behind > 0.1) {
                videoPlayer.currentTime = end - 0.05;
                lastAdvanceTime = now;
            }
        } else {
            lastAdvanceTime = now;
        }
        lastCurrentTime = current;

        if (behind > 0.2) {
            // 超过 200ms：直接跳到直播边缘，保留 50ms 缓冲
            videoPlayer.currentTime = end - 0.05;
            videoPlayer.playbackRate = 1;
        } else if (behind > 0.1) {
            // 100~200ms：2x 加速平滑追赶
            videoPlayer.playbackRate = 2;
        } else {
            videoPlayer.playbackRate = 1;
        }

        // 激进清理旧缓冲：只保留当前位置前 300ms
        if (current > 0.3 && !sourceBuffer.updating) {
            try { sourceBuffer.remove(0, current - 0.3); } catch (e) {}
        }
    }, 50);

    // 处理二进制视频数据：WebM 走 MSE，JPEG 走 canvas
    // pending 队列上限：40ms 切片 × 5 = 最多 200ms 排队延迟
    const MAX_PENDING = 5;

    function handleBinaryVideo(arrayBuffer) {
        if (!videoEnabled) return;
        const view = new Uint8Array(arrayBuffer);
        // WebM 以 EBML 头 0x1A 0x45 开头；JPEG 以 0xFF 0xD8 开头
        const isWebM = view.length >= 2 && view[0] === 0x1A && view[1] === 0x45;
        if (isWebM) {
            if (!mediaSource) initMediaSource();
            // ★ 关键修复：sourceBuffer 可能尚未创建（sourceopen 还没触发），
            //   此时必须入队而不是丢弃。第一块含 init segment，丢了就永久黑屏。
            if (!sourceBuffer || sourceBuffer.updating) {
                // 队列上限：解码端跟不上时丢弃最旧的媒体段，防止延迟累积
                if (pendingChunks.length >= MAX_PENDING) pendingChunks.shift();
                pendingChunks.push(arrayBuffer);
            } else {
                try { sourceBuffer.appendBuffer(arrayBuffer); }
                catch (e) {
                    if (pendingChunks.length >= MAX_PENDING) pendingChunks.shift();
                    pendingChunks.push(arrayBuffer);
                }
            }
        } else {
            // JPEG 帧：canvas 渲染（用于 snapshot 帧或无摄像头模式）
            renderJpegBlob(new Blob([arrayBuffer], { type: 'image/jpeg' }));
        }
    }

    function renderJpegBlob(blob) {
        if (!videoEnabled) return;
        videoCanvas.style.display = 'block';
        videoPlayer.style.display = 'none';
        if (typeof createImageBitmap !== 'undefined') {
            createImageBitmap(blob).then(bmp => {
                videoCanvas.width = bmp.width;
                videoCanvas.height = bmp.height;
                videoCtx.drawImage(bmp, 0, 0);
                bmp.close();
            }).catch(() => {});
        } else {
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                videoCanvas.width = img.naturalWidth;
                videoCanvas.height = img.naturalHeight;
                videoCtx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }
    }

    document.getElementById('btnStartVideo').onclick = function() {
        videoEnabled = true;
        videoPlayer.muted = true;
        // 订阅设备后，后端会自动转发 video_frame 消息，在此渲染到 canvas
        log('视频已开启，等待设备上传 video_frame...', 'success');
    };

    document.getElementById('btnStopVideo').onclick = function() {
        videoEnabled = false;
        videoPlayer.pause();
        log('已停止视频显示', 'info');
    };

    // 初始化
    if (location.hostname) {
        document.getElementById('serverUrl').value = `${location.protocol}//${location.hostname}:8082`;
    }
    log('测试助手已加载', 'info');
    log('使用提示：', 'info');
    log('  1. 输入后端地址（默认已填当前主机）', 'info');
    log('  2. 点击"连接"建立 WebSocket', 'info');
