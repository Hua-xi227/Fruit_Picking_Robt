<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>采摘机器人模拟器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 480px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 24px; font-size: 24px; }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: #ffd700; }
        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .row label { font-size: 14px; }
        input[type="text"], input[type="number"] {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 60%;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #4caf50;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { background: #888; cursor: not-allowed; }
        button.stop { background: #f44336; }
        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            background: #f44336;
        }
        .status.online { background: #4caf50; }
        .info { font-size: 13px; line-height: 1.6; }
        .info span { color: #ffd700; font-weight: bold; }
        video, canvas {
            width: 100%;
            background: #000;
            border-radius: 8px;
            display: block;
        }
        #preview { display: none; }
        .log {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        .log .success { color: #4caf50; }
        .log .error { color: #f44336; }
        .log .info { color: #90caf9; }
    </style>
</head>
<body>
<div class="container">
    <h1>🤖 采摘机器人模拟器</h1>

    <!-- 连接配置 -->
    <div class="card">
        <h2>1. 连接配置</h2>
        <div class="row">
            <label>后端地址:</label>
            <input type="text" id="serverUrl" value="" placeholder="http://192.168.1.100:8082">
        </div>
        <div class="row">
            <label>设备ID:</label>
            <input type="text" id="deviceId" value="car-001">
        </div>
        <div class="row">
            <label>定位上报(秒):</label>
            <input type="number" id="interval" value="2" min="1" max="60">
        </div>
        <div class="row">
            <label>视频上传间隔(毫秒):</label>
            <input type="number" id="frameInterval" value="200" min="50" max="2000">
        </div>
        <div class="row">
            <label>连接状态:</label>
            <span class="status" id="connStatus">未连接</span>
        </div>
        <button id="btnConnect">连接 WebSocket</button>
    </div>

    <!-- 位置信息 -->
    <div class="card">
        <h2>2. 当前位置</h2>
        <div class="info">
            经度: <span id="lng">--</span><br>
            纬度: <span id="lat">--</span><br>
            方向角: <span id="bearing">--</span>°<br>
            精度: <span id="accuracy">--</span> m
        </div>
        <button id="btnGetLocation">获取一次位置</button>
        <button id="btnStartLocation">开启持续定位</button>
    </div>

    <!-- 视频采集 -->
    <div class="card">
        <h2>3. 摄像头（模拟小车摄像头）</h2>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="preview" alt="预览">
        <button id="btnStartCamera">开启摄像头</button>
        <button id="btnStartUpload">开始上传视频帧</button>
        <button id="btnStopUpload" class="stop">停止上传</button>
    </div>

    <!-- 操作日志 -->
    <div class="card">
        <h2>4. 操作日志</h2>
        <div class="log" id="logArea"></div>
        <button id="btnClearLog" style="background:#666;">清空日志</button>
    </div>
</div>

<script>
    // ===== 全局变量 =====
    let ws = null;
    let watchId = null;
    let mediaStream = null;
    let uploadTimer = null;
    let lastBearing = 0;
    let isConnected = false;

    // ===== 工具函数 =====
    function log(msg, type = 'info') {
        const logArea = document.getElementById('logArea');
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = type;
        div.textContent = `[${time}] ${msg}`;
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
    }

    function getServerUrl() {
        let url = document.getElementById('serverUrl').value.trim();
        if (!url) {
            // 默认使用当前页面的主机
            url = `${location.protocol}//${location.hostname}:8082`;
        }
        return url.replace(/\/$/, '');
    }

    function getDeviceId() {
        return document.getElementById('deviceId').value.trim() || 'car-001';
    }

    function setConnStatus(online) {
        const el = document.getElementById('connStatus');
        el.textContent = online ? '已连接' : '未连接';
        el.className = 'status' + (online ? ' online' : '');
        isConnected = online;
    }

    // ===== 1. WebSocket 连接 =====
    document.getElementById('btnConnect').onclick = function() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.close();
            return;
        }
        const baseUrl = getServerUrl().replace(/^http/, 'ws');
        const wsUrl = `${baseUrl}/ws/location`;
        log(`正在连接: ${wsUrl}`);
        try {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                setConnStatus(true);
                log('WebSocket 连接成功 ✓', 'success');
            };
            ws.onclose = () => {
                setConnStatus(false);
                log('WebSocket 已断开', 'error');
            };
            ws.onerror = (e) => {
                log('WebSocket 错误: ' + e, 'error');
            };
            ws.onmessage = (event) => {
                log(`收到服务器消息: ${event.data.substring(0, 100)}`, 'info');
                // 可以在这里处理小车下发的指令，例如开始采摘、停止等
            };
        } catch (e) {
            log('连接失败: ' + e.message, 'error');
        }
    };

    // ===== 2. 位置上报 =====
    function sendLocation(lat, lng, bearing) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            log('WebSocket 未连接，无法发送位置', 'error');
            return;
        }
        const data = {
            lat: lat,
            lng: lng,
            bearing: bearing || 0,
            deviceId: getDeviceId(),
            timestamp: Date.now()
        };
        ws.send(JSON.stringify(data));
        log(`已发送位置: lat=${lat.toFixed(6)}, lng=${lng.toFixed(6)}`, 'success');
    }

    function updatePositionDisplay(lat, lng, bearing, accuracy) {
        document.getElementById('lat').textContent = lat.toFixed(6);
        document.getElementById('lng').textContent = lng.toFixed(6);
        document.getElementById('bearing').textContent = bearing.toFixed(1);
        document.getElementById('accuracy').textContent = accuracy.toFixed(1);
    }

    document.getElementById('btnGetLocation').onclick = function() {
        if (!navigator.geolocation) {
            log('浏览器不支持 Geolocation', 'error');
            return;
        }
        log('正在获取位置...');
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const { latitude, longitude, heading, accuracy } = pos.coords;
                const bearing = heading || lastBearing;
                lastBearing = bearing;
                updatePositionDisplay(latitude, longitude, bearing, accuracy);
                sendLocation(latitude, longitude, bearing);
            },
            (err) => {
                log('获取位置失败: ' + err.message, 'error');
                // 失败时使用模拟位置（方便测试）
                const mockLat = 31.2304 + (Math.random() - 0.5) * 0.01;
                const mockLng = 121.4737 + (Math.random() - 0.5) * 0.01;
                const mockBearing = Math.random() * 360;
                log(`使用模拟位置: lat=${mockLat.toFixed(6)}, lng=${mockLng.toFixed(6)}`, 'info');
                updatePositionDisplay(mockLat, mockLng, mockBearing, 10);
                sendLocation(mockLat, mockLng, mockBearing);
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    };

    document.getElementById('btnStartLocation').onclick = function() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            log('已停止持续定位', 'info');
            this.textContent = '开启持续定位';
            return;
        }
        if (!navigator.geolocation) {
            log('浏览器不支持 Geolocation', 'error');
            return;
        }
        const interval = parseInt(document.getElementById('interval').value) * 1000;
        log(`开启持续定位，间隔 ${interval}ms`);
        watchId = navigator.geolocation.watchPosition(
            (pos) => {
                const { latitude, longitude, heading, accuracy } = pos.coords;
                const bearing = heading || lastBearing;
                lastBearing = bearing;
                updatePositionDisplay(latitude, longitude, bearing, accuracy);
                sendLocation(latitude, longitude, bearing);
            },
            (err) => {
                log('持续定位失败，使用模拟位置: ' + err.message, 'error');
                // 自动降级为模拟数据
                setInterval(() => {
                    const mockLat = 31.2304 + (Math.random() - 0.5) * 0.001;
                    const mockLng = 121.4737 + (Math.random() - 0.5) * 0.001;
                    const mockBearing = Math.random() * 360;
                    updatePositionDisplay(mockLat, mockLng, mockBearing, 10);
                    sendLocation(mockLat, mockLng, mockBearing);
                }, interval);
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
        this.textContent = '停止持续定位';
    };

    // ===== 3. 摄像头与视频上传 =====
    document.getElementById('btnStartCamera').onclick = async function() {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            document.getElementById('video').srcObject = mediaStream;
            log('摄像头已开启 ✓', 'success');
        } catch (e) {
            log('摄像头开启失败: ' + e.message, 'error');
            log('将使用模拟视频帧（彩色测试图）', 'info');
        }
    };

    document.getElementById('btnStartUpload').onclick = function() {
        if (uploadTimer) {
            log('视频帧上传已在运行', 'error');
            return;
        }
        const interval = parseInt(document.getElementById('frameInterval').value);
        log(`开始上传视频帧，间隔 ${interval}ms（约 ${(1000 / interval).toFixed(1)} fps）`);
        uploadTimer = setInterval(uploadFrame, interval);
    };

    document.getElementById('btnStopUpload').onclick = function() {
        if (uploadTimer) {
            clearInterval(uploadTimer);
            uploadTimer = null;
            log('已停止视频帧上传', 'info');
        }
    };

    function uploadFrame() {
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        canvas.width = 320;
        canvas.height = 240;
        const ctx = canvas.getContext('2d');

        if (mediaStream && video.readyState >= 2) {
            // 真实摄像头画面
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        } else {
            // 生成模拟测试图（时间戳 + 渐变背景）
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            const hue = (Date.now() / 10) % 360;
            gradient.addColorStop(0, `hsl(${hue}, 70%, 50%)`);
            gradient.addColorStop(1, `hsl(${(hue + 60) % 360}, 70%, 30%)`);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('🤖 采摘机器人', 60, 100);
            ctx.font = '14px monospace';
            ctx.fillText('Device: ' + getDeviceId(), 60, 130);
            ctx.fillText('Time: ' + new Date().toLocaleTimeString(), 60, 155);
            // 画一个移动的小圆点表示位置
            const t = Date.now() / 500;
            const x = 160 + Math.cos(t) * 80;
            const y = 200 + Math.sin(t) * 20;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ff0';
            ctx.fill();
        }

        canvas.toBlob(blob => {
            if (!blob) return;
            const formData = new FormData();
            formData.append('file', blob, 'frame.jpg');
            formData.append('deviceId', getDeviceId());
            const url = `${getServerUrl()}/api/video/upload`;
            fetch(url, { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => log(`视频帧上传 ${data.success === 200 ? '成功' : '失败'}: ${data.success || ''}`, data.success === 200 ? 'success' : 'error'))
                .catch(e => log('视频帧上传异常: ' + e.message, 'error'));
        }, 'image/jpeg', 0.7);
    }

    // ===== 4. 清空日志 =====
    document.getElementById('btnClearLog').onclick = function() {
        document.getElementById('logArea').innerHTML = '';
    };

    // ===== 初始化 =====
    if (location.hostname) {
        document.getElementById('serverUrl').value = `${location.protocol}//${location.hostname}:8082`;
    }
    log('模拟器已加载，请配置后端地址后点击"连接 WebSocket"', 'info');
</script>
</body>
</html>
